name: Documentation validation
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**/*.png'
      - 'docs/**/*.jpg'
      - 'docs/**/*.jpeg'
      - 'docs/**/*.gif'
      - 'docs/**/*.webp'
      - 'docs/**/.gitkeep'
      - 'cmake/check_links.py'
      - 'tools/check_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**/*.png'
      - 'docs/**/*.jpg'
      - 'docs/**/*.jpeg'
      - 'docs/**/*.gif'
      - 'docs/**/*.webp'
      - 'docs/**/.gitkeep'
      - 'cmake/check_links.py'
      - 'tools/check_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate README links and documentation
        run: |
          python3 cmake/check_links.py
          python3 tools/check_docs.py
