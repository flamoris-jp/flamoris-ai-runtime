name: C++ contract and qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release, clang-debug, clang-asan, clang-tsan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate reviewed image and dependency package
        shell: bash
        run: |
          test "$ImageVersion" = "20260920.314.1"
          test "$(dpkg-query -W -f='${Version}' libssl-dev)" = "3.0.13-0ubuntu3.15"
          test "$(g++-13 -dumpfullversion)" = "13.3.0"
          clang++-18 --version
      - name: Configure offline
        run: cmake --preset ${{ matrix.preset }} -DFLAMORIS_LOCKED_TOOLCHAIN=ON -DFLAMORIS_NATIVE_TESTS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --no-tests=error
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate reviewed image
        shell: pwsh
        run: |
          if ($env:ImageVersion -ne '20260920.314.1') { throw 'Runner image changed; review the toolchain lock.' }
          $vs = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -version '[17.0,18.0)' -property installationVersion
          if ($vs -ne '17.14.37710.0') { throw 'Visual Studio version changed.' }
      - name: Configure, build and test offline with initialized MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset ${{ matrix.preset }} -DFLAMORIS_NATIVE_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build --preset ${{ matrix.preset }} --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset ${{ matrix.preset }} --no-tests=error
          if errorlevel 1 exit /b 1
  style-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify format and local documentation links
        run: |
          test "$ImageVersion" = "20260920.314.1"
          clang-format-18 --version | rg -F '18.1.3'
          rg --files include src tests -g '*.hpp' -g '*.cpp' | xargs clang-format-18 --dry-run --Werror
          python3 cmake/check_links.py
      - name: Analyze project-owned translation units
        run: |
          cmake --preset clang-debug -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
          cmake --build --preset clang-debug --parallel 2
